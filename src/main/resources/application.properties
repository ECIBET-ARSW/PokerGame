spring.application.name=pokerService

spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongo:27017/dataDB}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

server.port=8085

logging.file.name=/home/ec2-user/ecibet-poker.log
logging.file.max-size=10MB
logging.file.max-history=7
logging.level.com.ecibet=DEBUG

management.endpoints.web.exposure.include=health,prometheus,metrics
management.metrics.tags.application=${spring.application.name}